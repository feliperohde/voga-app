# Windows and Linux builds, llama.cpp and Whisper on Vulkan (NVIDIA, AMD and Intel GPUs; the Vulkan
# loader comes with the video driver; models fall back to the processor when the GPU cannot load them).
# The installers come out as the run's artifacts.
# Updater artifacts are signed only when the TAURI_SIGNING_PRIVATE_KEY secret (+ _PASSWORD) is set.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # Only to test changes to this file
  pull_request:
    paths: ['.github/workflows/build.yml']

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the oldest glibc still supported, so the AppImage/deb run on more distributions
          - os: ubuntu-22.04
            bundles: deb,appimage
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage*
          - os: windows-latest
            bundles: nsis,msi
            files: |
              target/release/bundle/nsis/*.exe*
              target/release/bundle/msi/*.msi*
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev build-essential cmake clang patchelf file

      # Headers, loader and glslc to compile llama.cpp's and whisper.cpp's Vulkan shaders.
      # LunarG keeps only the latest ~17 SDKs downloadable: bump this one when it goes
      # (https://vulkan.lunarg.com/sdk/versions/windows.json and linux.json must both list it)
      - uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.321.1
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--llama=vulkan --bundles ${{ matrix.bundles }})
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          node scripts/tauri-auto.js build "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: voga-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
