# flowsint on this computer, managed by Voga (Settings › flowsint): written to
# <app data>/flowsint/compose.yml and run as the Docker Compose project "voga-flowsint".
# Adapted from flowsint's docker-compose.prod.yml (github.com/reconurge/flowsint, Apache-2.0):
# pinned images, only the web app published (on 127.0.0.1), and no Docker socket for the
# containers (flowsint's network scanners, which run tools in containers, are left out).
# The values come from the .env file next to it.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowsint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: flowsint
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowsint"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      # A personal graph: keep the memory modest
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} \"RETURN 1\""]
      interval: 10s
      timeout: 20s
      retries: 12
      start_period: 30s

  api:
    image: ghcr.io/reconurge/flowsint-api:${FLOWSINT_VERSION}
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://flowsint:${POSTGRES_PASSWORD}@postgres:5432/flowsint
      - NEO4J_URI_BOLT=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - AUTH_SECRET=${AUTH_SECRET}
      - MASTER_VAULT_KEY_V1=${MASTER_VAULT_KEY_V1}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=http://127.0.0.1:${FLOWSINT_PORT},http://localhost:${FLOWSINT_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  celery:
    image: ghcr.io/reconurge/flowsint-api:${FLOWSINT_VERSION}
    restart: unless-stopped
    command: ["celery", "-A", "flowsint_core.core.celery", "worker", "--loglevel=info", "--pool=threads", "--concurrency=4"]
    environment:
      - DATABASE_URL=postgresql://flowsint:${POSTGRES_PASSWORD}@postgres:5432/flowsint
      - NEO4J_URI_BOLT=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MASTER_VAULT_KEY_V1=${MASTER_VAULT_KEY_V1}
      - REDIS_URL=redis://redis:6379/0
      - SKIP_MIGRATIONS=true
      - AUTH_SECRET=${AUTH_SECRET}
    # The image's own healthcheck calls an HTTP port the worker does not have, so it always
    # fails; upstream's compose replaces it with Celery's ping, as here (`up --wait` needs one)
    healthcheck:
      test: ["CMD-SHELL", "celery -A flowsint_core.core.celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 15s
      timeout: 20s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  app:
    image: ghcr.io/reconurge/flowsint-app:${FLOWSINT_VERSION}
    restart: unless-stopped
    ports:
      # Only this computer: the image's nginx accepts localhost and 127.0.0.1 hosts
      - "127.0.0.1:${FLOWSINT_PORT}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
